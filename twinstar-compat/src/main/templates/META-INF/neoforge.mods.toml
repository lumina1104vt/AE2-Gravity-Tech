modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="ae2"
    type="required"
    versionRange="[19.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="twinstar_api"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# the mod this one knows: may be absent
[[dependencies."${mod_id}"]]
    modId="neoecoae"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
