pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include("core")
include("lumina-multiblock")
include("lumina-bridge")
project(":lumina-bridge").projectDir = file("lumina-lib/bridge")
include("lumina-corelib")
project(":lumina-corelib").projectDir = file("lumina-lib/corelib")
include("twinstar-core")
project(":twinstar-core").projectDir = file("core/twinstar-core")
include("twinstar-api")
project(":twinstar-api").projectDir = file("core/twinstar-api")
include("twinstar-ae2")
project(":twinstar-ae2").projectDir = file("core/twinstar-ae2")
