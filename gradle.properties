# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# This branch (1.20.1-beta) is MinecraftForge 1.20.1, built with ModDevGradle's legacy Forge plugin.
# Forge versions: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=1.20.1-47.4.29
# Version range written into each mod's mods.toml
forge_version_range=[47.4,)
# FML's major version bounds the loader version
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

## Mod Properties
# These describe ae2_gvt. The lib modules (core, lumina-multiblock) override them in their own
# gradle.properties; everything else (versions, dependencies) is shared from this file.

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=ae2_gvt
# The human-readable display name for the mod.
mod_name=AE2 Gravity Tech
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=20.0.0.1-beta
# The two bundled lib mods. Their versions are set here only (their own gradle.properties leave it out).
twinstar_mod_version=20.0.1.1
lumina_multiblock_mod_version=20.0.0.1-beta
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.lumina.ae2_gvt
# Shown in the mod list
mod_authors=Lumina

