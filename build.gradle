// AE2 : Gravity Tech (ae2_gvt). The root project is the mod itself and also owns the dev runs,
// which load the two sibling mods beside it:
//   :core               twinstar - the twin-star crafting engine (lib mod)
//   :lumina-multiblock  lumina_multiblock - multiblock structure library (lib mod)
// Shared setup (repositories, Java, Forge / Parchment, mods.toml expansion, ...) is in
// gradle/mod-common.gradle; versions are in gradle.properties.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

// mod description: the text lives in description.txt (UTF-8, English then 繁體中文)
ext.mod_description = file('description.txt').getText('UTF-8')

apply from: rootProject.file('gradle/mod-common.gradle')

tasks.named('wrapper', Wrapper).configure {
    // BIN keeps the wrapper download small; switch to ALL for Gradle sources in the IDE
    distributionType = Wrapper.DistributionType.BIN
}

// the runs below reference the lib mods' source sets, so configure those projects first
evaluationDependsOn(':core')
evaluationDependsOn(':lumina-multiblock')

legacyForge {
    // access transformers are picked up from META-INF/accesstransformer.cfg automatically
    validateAccessTransformers = true

    runs {
        client {
            client()
            devLogin = true
            // comma-separated namespaces to load gametests from; empty = all
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // beside the client's folder, so a server and a client can run at the same time
            gameDirectory = file('run/server')
            systemProperty 'ae2_gvt.loadMixinTargets', 'true'
            systemProperty 'ae2_gvt.devNetworkTest', 'true'
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // for looking at the rendering without the IDE: a server with two holes in front of the spawn, and an offline client that joins it
        holeServer {
            server()
            gameDirectory = file('run/holeserver')
            systemProperty 'ae2_gvt.devHoles', 'true'
            programArgument '--nogui'
        }
        holeClient {
            client()
            gameDirectory = file('run/holeclient')
            programArguments.addAll '--username', 'DevTest', '--quickPlayMultiplayer', 'localhost:25599'
        }

        // runs every registered gametest, then exits (crashes when there are none)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // log markers: SCAN (mod scan), REGISTRIES (registry events), REGISTRYDUMP (registry contents)
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // which sources belong to which mod; all three are loaded in the dev runs
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "twinstar" {
            sourceSet(project(':core').sourceSets.main)
        }
        "lumina_multiblock" {
            sourceSet(project(':lumina-multiblock').sourceSets.main)
        }
    }
}

// the two lib mods have mixins of their own (the multiblock lib's chunk hook, the twin-star recipe hook); the dev runs load them too
mixin {
    add project(':core').sourceSets.main, "twinstar.refmap.json"
    config "twinstar.mixins.json"
    add project(':lumina-multiblock').sourceSets.main, "lumina_multiblock.refmap.json"
    config "lumina_multiblock.mixins.json"
}

// 'localRuntime': on the dev runtime classpath, but not published as a dependency of this mod
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // our lib mods: compiled against here; bundled into the ae2_gvt jar by jarJar below
    compileOnly project(':core')
    localRuntime project(':core')
    compileOnly project(':lumina-multiblock')
    localRuntime project(':lumina-multiblock')

    // dev runs: Forge reads a mod's mixin config from the classpath before the mod layer exists, so it is put there on its own
    additionalRuntimeClasspath files(tasks.register('devMixinConfig', Copy) {
        from('src/main/resources') { include "${mod_id}.mixins.json" }
        from(layout.buildDirectory.dir('mixin')) { include "${mod_id}.refmap.json" }
        from('core/src/main/resources') { include 'twinstar.mixins.json' }
        from('core/build/mixin') { include 'twinstar.refmap.json' }
        from('lumina-multiblock/src/main/resources') { include 'lumina_multiblock.mixins.json' }
        from('lumina-multiblock/build/mixin') { include 'lumina_multiblock.refmap.json' }
        into layout.buildDirectory.dir('devMixin')
    }.map { it.destinationDir })

    // MixinExtras: the lib mods' mixins use it; carried in the jar, and loaded in the dev runs
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.5'
    jarJar('io.github.llamalad7:mixinextras-forge:[0.5.5,)')

    // bundled into the ae2_gvt jar (jar-in-jar); each lib keeps its own mod id
    jarJar(project(':core'))
    jarJar(project(':lumina-multiblock'))

    // AE2: we build against it (the terminal extends AE2's classes) and run it in the dev client.
    // The mods on Modrinth are obfuscated (SRG): the mod* configurations remap them to the names we write.
    modCompileOnly "maven.modrinth:ae2:${ae2_version}"
    modCompileOnly "maven.modrinth:guideme:${guideme_version}"
    modRuntimeOnly "maven.modrinth:ae2:${ae2_version}"
    modRuntimeOnly "maven.modrinth:guideme:${guideme_version}"

    // GeckoLib: the anti-gravity armor's 3D model and its animated texture
    modCompileOnly "maven.modrinth:geckolib:${geckolib_version}"
    modRuntimeOnly "maven.modrinth:geckolib:${geckolib_version}"

    // JEI (recipe lookup; the pattern terminal's [+] transfer will hook into it)
    modCompileOnly "maven.modrinth:emi:${emi_version}"
    modCompileOnly "maven.modrinth:jei:${jei_version}"
    modRuntimeOnly "maven.modrinth:jei:${jei_version}"
    // JEI 15.75 needs these two (Modrinth: mezzconfig 0.7.1, mezzconfiggui for 1.20.1 0.7.2)
    modRuntimeOnly "maven.modrinth:mezzconfig:wcPo3ErK"
    modRuntimeOnly "maven.modrinth:mezzconfiggui:rHGm7e23"

    // Jade (looking at a block shows what it is); compileOnly for a plugin later
    modCompileOnly "maven.modrinth:jade:${jade_version}"
    modRuntimeOnly "maven.modrinth:jade:${jade_version}"

    // Immersive Engineering: only to try its machines (the alloy smelter takes its items through a GUI)
    modRuntimeOnly "maven.modrinth:immersiveengineering:${immersiveengineering_version}"

    // ExtendedAE (EAE): compile against it for compat later, run it in the dev client; EAE needs glodium and ae2wtlib
    modCompileOnly "maven.modrinth:extended-ae:${extendedae_version}"
    // 1.20.1 dev run: needs more libraries (mezz_config / curios / architectury / cloth_config); left out for now
    // modRuntimeOnly "maven.modrinth:extended-ae:${extendedae_version}"
    // 1.20.1 dev run: needs more libraries (mezz_config / curios / architectury / cloth_config); left out for now
    // modRuntimeOnly "maven.modrinth:glodium:${glodium_version}"
    // 1.20.1 dev run: needs more libraries (mezz_config / curios / architectury / cloth_config); left out for now
    // modRuntimeOnly "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"

    // dev client only: building helpers (megastructures get big)
    // 1.20.1 dev run: needs more libraries (mezz_config / curios / architectury / cloth_config); left out for now
    // modRuntimeOnly "maven.modrinth:construction-wand-kots:${construction_wand_version}"
    // dev client only: stops the game swallowing keystrokes from Chinese / other IMEs
    // 1.20.1 dev run: needs more libraries (mezz_config / curios / architectury / cloth_config); left out for now
    // modRuntimeOnly "maven.modrinth:imblocker-original:${imblocker_version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
