// AE2 : Gravity Tech (ae2_gvt). The root project is the mod itself and also owns the dev runs,
// which load the two sibling mods beside it:
//   :core               twinstar - the twin-star crafting engine (lib mod)
//   :lumina-multiblock  lumina_multiblock - multiblock structure library (lib mod)
// Shared setup (repositories, Java, NeoForge / Parchment, mods.toml expansion, ...) is in
// gradle/mod-common.gradle; versions are in gradle.properties.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

// mod description: the text lives in description.txt (UTF-8, English then 繁體中文)
ext.mod_description = file('description.txt').getText('UTF-8')

apply from: rootProject.file('gradle/mod-common.gradle')

tasks.named('wrapper', Wrapper).configure {
    // BIN keeps the wrapper download small; switch to ALL for Gradle sources in the IDE
    distributionType = Wrapper.DistributionType.BIN
}

// the runs below reference the lib mods' source sets, so configure those projects first
evaluationDependsOn(':core')
evaluationDependsOn(':lumina-multiblock')
evaluationDependsOn(':twinstar-core')
evaluationDependsOn(':twinstar-api')
evaluationDependsOn(':lumina-bridge')
evaluationDependsOn(':lumina-corelib')

neoForge {
    // access transformers are picked up from META-INF/accesstransformer.cfg automatically

    runs {
        client {
            client()
            devLogin = true
            // comma-separated namespaces to load gametests from; empty = all
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // runs every registered gametest, then exits (crashes when there are none)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // log markers: SCAN (mod scan), REGISTRIES (registry events), REGISTRYDUMP (registry contents)
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // which sources belong to which mod; all three are loaded in the dev runs
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "twinstar" {
            sourceSet(project(':core').sourceSets.main)
        }
        "lumina_multiblock" {
            sourceSet(project(':lumina-multiblock').sourceSets.main)
        }
        "twinstar_core" {
            sourceSet(project(':twinstar-core').sourceSets.main)
        }
        "twinstar_api" {
            sourceSet(project(':twinstar-api').sourceSets.main)
        }
        "lumina_bridge" {
            sourceSet(project(':lumina-bridge').sourceSets.main)
        }
        "lumina_corelib" {
            sourceSet(project(':lumina-corelib').sourceSets.main)
        }
    }
}

// 'localRuntime': on the dev runtime classpath, but not published as a dependency of this mod
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // our lib mods: compiled against here; bundled into the ae2_gvt jar by jarJar below
    compileOnly project(':core')
    localRuntime project(':core')
    compileOnly project(':lumina-multiblock')
    localRuntime project(':lumina-multiblock')

    // bundled into the ae2_gvt jar (jar-in-jar); each lib keeps its own mod id
    jarJar(project(':core'))
    jarJar(project(':lumina-multiblock'))

    // the twin-star engine's pure logic (plain library) and its interfaces (lib mod)
    compileOnly project(':twinstar-core')
    localRuntime project(':twinstar-core')
    jarJar(project(':twinstar-core'))
    compileOnly project(':twinstar-api')
    localRuntime project(':twinstar-api')
    jarJar(project(':twinstar-api'))

    // the Lumina base layers (version-neutral types, shared infrastructure)
    compileOnly project(':lumina-bridge')
    localRuntime project(':lumina-bridge')
    jarJar(project(':lumina-bridge'))
    compileOnly project(':lumina-corelib')
    localRuntime project(':lumina-corelib')
    jarJar(project(':lumina-corelib'))

    // plain-Java tests (no Minecraft classes on their path), e.g. the same-machine picking of the machine access interface
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // AE2: we build against it (the terminal extends AE2's classes) and run it in the dev client
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"

    // GeckoLib: the anti-gravity armor's 3D model and its animated texture
    compileOnly "maven.modrinth:geckolib:${geckolib_version}"
    localRuntime "maven.modrinth:geckolib:${geckolib_version}"

    // JEI (recipe lookup; the pattern terminal's [+] transfer will hook into it)
    compileOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:jei:${jei_version}"
    localRuntime "maven.modrinth:jei:${jei_version}"

    // LDLib2: the twin-star lib's plan screen is built with its UI
    localRuntime "maven.modrinth:ldlib:${ldlib_version}"

    // Jade (looking at a block shows what it is); compileOnly for a plugin later
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // Immersive Engineering: only to try its machines (the alloy smelter takes its items through a GUI)
    localRuntime "maven.modrinth:immersiveengineering:${immersiveengineering_version}"

    // ExtendedAE (EAE) and ExtendedAE-Plus (EAEP): compile against them for compat later, run them in
    // the dev client; EAE needs glodium and ae2wtlib (its wireless terminal API)
    compileOnly "maven.modrinth:extended-ae:${extendedae_version}"
    localRuntime "maven.modrinth:extended-ae:${extendedae_version}"
    localRuntime "maven.modrinth:glodium:${glodium_version}"
    localRuntime "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"
//    compileOnly "maven.modrinth:extendedae-plus:${extendedae_plus_version}"
//    localRuntime "maven.modrinth:extendedae-plus:${extendedae_plus_version}"

    // dev client only: building helpers (megastructures get big)
    localRuntime "maven.modrinth:construction-wand-kots:${construction_wand_version}"
    localRuntime "curse.maven:building-gadgets-298187:${building_gadgets_file}"
    // dev client only: stops the game swallowing keystrokes from Chinese / other IMEs
    localRuntime "maven.modrinth:imblocker-original:${imblocker_version}"
}

repositories {
    mavenCentral()  // JUnit
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
