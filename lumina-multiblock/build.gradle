// lumina_multiblock - multiblock structure library, a separate lib mod. No runs of its own: the
// root project's runs load it beside Gravity Tech. Shared setup: gradle/mod-common.gradle.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev'   // version from the root project
}

apply from: rootProject.file('gradle/mod-common.gradle')

neoForge {
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
