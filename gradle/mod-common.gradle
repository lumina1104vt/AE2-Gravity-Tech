// Shared by all three mods (root ae2_gvt, :core twinstar, :lumina-multiblock).
// Applied after the plugins block (`apply from: rootProject.file('gradle/mod-common.gradle')`), so
// the moddev `legacyForge` extension already exists. Versions come from the root gradle.properties;
// each module's own gradle.properties only sets its mod identity (mod_id, mod_name, ...).

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 runs on Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // CurseForge-only mods (e.g. Building Gadgets): curse.maven:<slug>-<projectId>:<fileId>
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

legacyForge {
    version = project.forge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
}

sourceSets.main.resources {
    // resources generated by data generators
    srcDir('src/generated/resources')
    // development-only files never go into the jar
    exclude("**/*.bbmodel")             // BlockBench project files
    exclude("src/generated/**/.cache")  // datagen cache files
}

// Fills the ${...} placeholders in src/main/templates (mods.toml). Every key is defined
// for every module (root gradle.properties + the module's own), so the templates may use any of them.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            twinstar_mod_version   : rootProject.twinstar_mod_version,
            lumina_multiblock_mod_version: rootProject.lumina_multiblock_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// regenerate on every IDE sync, so the IDE runs never see a stale mods.toml
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

// Forge loads a mod's mixin config from the jar manifest (and the refmap maps the names to the runtime's)
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.spongepowered:mixin:0.8.5'
}
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}
jar {
    manifest.attributes(["MixinConfigs": "${mod_id}.mixins.json"])
}

// IDEA no longer downloads sources / javadoc for dependencies by itself
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
